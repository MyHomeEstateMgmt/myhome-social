<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{width:1080px;height:1350px;background:#1E3D1E;font-family:'Inter',sans-serif;color:#fff;overflow:hidden;position:relative}
  .top{padding:70px 80px 0}
  .eyebrow{color:#C89A5B;font-weight:700;letter-spacing:6px;font-size:26px;text-transform:uppercase}
  h1{white-space:nowrap;font-family:'DejaVu Serif',serif;font-size:84px;line-height:1.02;margin:18px 0 0;font-weight:700}
  h1 span{color:#C89A5B}
  .art{position:absolute;top:330px;left:0;width:1080px;height:560px}
  .art{top:300px;height:410px}
  .list{position:absolute;top:715px;left:80px;right:80px}
  .cta{position:absolute;top:1078px;left:80px;right:80px;background:#C89A5B;color:#1E3D1E;border-radius:14px;padding:22px 30px;display:flex;align-items:center;gap:24px}
  .cta .h{font-family:'DejaVu Serif',serif;font-weight:700;font-size:31px;line-height:1.1}
  .cta .s{font-size:24px;font-weight:500;margin-top:6px}
  .cta .badge{flex:none;width:70px;height:70px;border-radius:50%;background:#1E3D1E;color:#C89A5B;display:flex;align-items:center;justify-content:center;font-size:38px}
  .item{display:flex;align-items:center;gap:26px;padding:13px 0;border-top:2px solid rgba(200,154,91,.35);font-size:34px;font-weight:500}
  .num{flex:none;width:58px;height:58px;border-radius:50%;background:#C89A5B;color:#1E3D1E;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center}
  .foot{position:absolute;bottom:34px;align-items:flex-end;left:80px;right:80px;display:flex;justify-content:space-between;font-size:24px;color:rgba(255,255,255,.75);letter-spacing:1px}
  .foot b{color:#C89A5B;font-weight:700}
</style></head>
<body>
  <div class="top">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE_LINE1}}<br><span>{{TITLE_LINE2}}</span></h1>
  </div>

  {{ART_SVG}}

  <div class="list">
{{ITEMS}}
  </div>

  <div class="cta">
    <div class="badge">✓</div>
    <div><div class="h">{{CTA_HEAD}}</div>
    <div class="s">{{CTA_SUB}}</div></div>
  </div>

  <div class="foot"><img src="../brand/logo-white.png" style="height:104px;display:block"><span><b>317-440-9258</b> · myhomeestatemgmt.com</span></div>
<script>
// Shrink headline until both lines fit on one line each (max 2 lines, 200px tall)
(function(){var h=document.querySelector('h1'),s=84;
 while((h.scrollWidth>920||h.offsetHeight>200)&&s>44){s-=2;h.style.fontSize=s+'px';}})();
</script>
</body></html>
